    window.ClinicStore = window.ClinicStore || {
      getAppointments() {
        try {
          const data = localStorage.getItem('smilecare_appointments');
          if (!data || data === '[]') {
            localStorage.setItem('smilecare_appointments', JSON.stringify(DEFAULT_APPOINTMENTS));
            localStorage.setItem('smilecare_token_seq', '5');
            return DEFAULT_APPOINTMENTS;
          }
          const parsed = JSON.parse(data);
          if (!Array.isArray(parsed) || parsed.length === 0) {
            localStorage.setItem('smilecare_appointments', JSON.stringify(DEFAULT_APPOINTMENTS));
            return DEFAULT_APPOINTMENTS;
          }
          return parsed;
        } catch (e) {
          return DEFAULT_APPOINTMENTS;
        }
      },
      getNextToken() {
        let seq = parseInt(localStorage.getItem('smilecare_token_seq') || '0', 10);
        if (!seq || seq < 5) {
          const list = this.getAppointments();
          let maxNum = 0;
          list.forEach(a => {
            if (a.queueNumber && a.queueNumber > maxNum) maxNum = a.queueNumber;
            const match = a.id && a.id.match(/\d+/);
            if (match) {
              const n = parseInt(match[0], 10);
              if (n > maxNum && n < 9000) maxNum = n;
            }
          });
          seq = Math.max(maxNum, list.length, 5);
        }
        seq += 1;
        localStorage.setItem('smilecare_token_seq', seq.toString());
        const padded = String(seq).padStart(3, '0');
        return {
          tokenId: `SPA-${padded}`,
          queueNumber: seq
        };
      },
      addAppointment(apt) {
        const list = this.getAppointments();
        let tokenId = apt.id;
        let queueNumber = apt.queueNumber;
        if (!tokenId || !tokenId.startsWith('SPA-')) {
          const next = this.getNextToken();
          tokenId = next.tokenId;
          queueNumber = next.queueNumber;
        }
        const newApt = {
          status: 'Confirmed',
          createdAt: new Date().toISOString(),
          ...apt,
          id: tokenId,
          queueNumber: queueNumber || list.length + 1
        };
        list.unshift(newApt);
        localStorage.setItem('smilecare_appointments', JSON.stringify(list));
        window.dispatchEvent(new Event('storage'));
        return newApt;
      },
      updateStatus(id, newStatus) {
        const list = this.getAppointments();
        const item = list.find(a => a.id === id);
        if (item) {
          item.status = newStatus;
          localStorage.setItem('smilecare_appointments', JSON.stringify(list));
          window.dispatchEvent(new Event('storage'));
        }
        return list;
      },
      deleteAppointment(id) {
        let list = this.getAppointments();
        list = list.filter(a => a.id !== id);
        localStorage.setItem('smilecare_appointments', JSON.stringify(list));
        window.dispatchEvent(new Event('storage'));
        return list;
      },
      resetDefaults() {
        localStorage.setItem('smilecare_appointments', JSON.stringify(DEFAULT_APPOINTMENTS));
        localStorage.setItem('smilecare_token_seq', '5');
        window.dispatchEvent(new Event('storage'));
        return DEFAULT_APPOINTMENTS;
      },
      normalizeDate(d) {
        if (!d) return '';
        const str = String(d).trim().toLowerCase();
        const today = new Date().toISOString().split('T')[0];
        if (str === 'today') return today;
        if (str === 'tomorrow') {
          const t = new Date();
          t.setDate(t.getDate() + 1);
          return t.toISOString().split('T')[0];
        }
        return d;
      },
      isSlotBooked(doctorName, date, time) {
        const list = this.getAppointments();
        const targetDate = this.normalizeDate(date);
        return list.some(a => {
          if (a.status === 'Cancelled') return false;
          const aDate = this.normalizeDate(a.date);
          const docMatch = (a.doctor || '').toLowerCase().includes((doctorName || '').toLowerCase()) ||
                           (doctorName || '').toLowerCase().includes((a.doctor || '').toLowerCase());
          const timeMatch = (a.time || '').toLowerCase().includes((time || '').toLowerCase());
          return docMatch && aDate === targetDate && timeMatch;
        });
      },
      getBookedAppointment(doctorName, date, time) {
        const list = this.getAppointments();
        const targetDate = this.normalizeDate(date);
        return list.find(a => {
          if (a.status === 'Cancelled') return false;
          const aDate = this.normalizeDate(a.date);
          const docMatch = (a.doctor || '').toLowerCase().includes((doctorName || '').toLowerCase()) ||
                           (doctorName || '').toLowerCase().includes((a.doctor || '').toLowerCase());
          const timeMatch = (a.time || '').toLowerCase().includes((time || '').toLowerCase());
          return docMatch && aDate === targetDate && timeMatch;
        });
      }
    };

  <script>
    /* ══════════════════════════════════════════════════
       1. Sliding Pill Nav Animation
       ══════════════════════════════════════════════════ */
    (function initNavPill() {
      function setup() {
        const nav = document.querySelector('header nav');
        if (!nav) return requestAnimationFrame(setup);

        const pill = document.createElement('div');
        pill.className = 'nav-pill-indicator';
        nav.style.position = 'relative';
        nav.appendChild(pill);

        const links = nav.querySelectorAll('a');

        function movePill(el) {
          const navRect = nav.getBoundingClientRect();
          const elRect = el.getBoundingClientRect();
          pill.style.left = (elRect.left - navRect.left) + 'px';
          pill.style.width = elRect.width + 'px';
          pill.classList.add('visible');
        }

        function hidePill() {
          const active = nav.querySelector('a.nav-active');
          if (active) movePill(active); else pill.classList.remove('visible');
        }

        links.forEach(link => {
          link.addEventListener('mouseenter', () => movePill(link));
          link.addEventListener('mouseleave', hidePill);
          link.addEventListener('click', () => {
            links.forEach(l => l.classList.remove('nav-active'));
            link.classList.add('nav-active');
            movePill(link);
          });
        });

        // Inject Mobile Quick Pill Nav Bar inside <header>
        const headerEl = document.querySelector('header');
        if (headerEl && !document.getElementById('mobile-quick-nav')) {
          const mobBar = document.createElement('div');
          mobBar.id = 'mobile-quick-nav';
          mobBar.innerHTML = `
            <a href="#services">Treatments</a>
            <a href="#transformation">Before &amp; After</a>
            <a href="#pricing">Pricing</a>
            <a href="#specialists">Doctors</a>
            <a href="#faq">FAQs</a>
            <button type="button" class="mob-check-btn" onclick="window.openCheckAppointmentModal && window.openCheckAppointmentModal()">🔍 Check Status</button>
            <a href="https://wa.me/923001234567?text=Hi%20Aura%20Dental%20Spa" target="_blank" rel="noopener noreferrer" class="mob-wa-btn">💬 WhatsApp</a>
          `;
          headerEl.appendChild(mobBar);
        }

        const sectionIds = Array.from(links).map(a => a.getAttribute('href')).filter(h => h && h.startsWith('#'));
        function onScroll() {
          let current = '';
          for (const id of sectionIds) {
            const sec = document.querySelector(id);
            if (sec && sec.getBoundingClientRect().top <= 160) current = id;
          }
          links.forEach(link => {
            if (link.getAttribute('href') === current) link.classList.add('nav-active');
            else link.classList.remove('nav-active');
          });
          const active = nav.querySelector('a.nav-active');
          if (active) movePill(active); else pill.classList.remove('visible');

          // Sync mobile pill active highlight
          const mobLinks = document.querySelectorAll('#mobile-quick-nav a[href^="#"]');
          mobLinks.forEach(ml => {
            if (ml.getAttribute('href') === current) ml.classList.add('mob-active');
            else ml.classList.remove('mob-active');
          });
        }
        window.addEventListener('scroll', onScroll, { passive: true });
        setTimeout(onScroll, 300);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => setTimeout(setup, 200));
      } else {
        setTimeout(setup, 200);
      }
    })();

      /* ── Helper: build status info ── */
      function getStatusInfo(status) {
        const s = (status || '').toLowerCase();
        if (s === 'cancelled')                      return { cls: 'st-cancelled', label: '✗  Cancelled' };
        if (s === 'in-chair' || s === 'in chair')   return { cls: 'st-inchair',   label: '⚡ In-Chair Now' };
        if (s === 'treatment done' || s === 'done' || s === 'completed')
                                                    return { cls: 'st-done',      label: '✓  Treatment Done' };
        return                                             { cls: 'st-confirmed', label: '● Confirmed' };
      }

      /* ── Render results ── */
      function renderResults(results) {

                <svg width="13" height="13" viewBox="0 0 24 24" fill="#16a34a"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
                Ask on WhatsApp

        const html = results.map(apt => {

                    Yeh appointment reception desk se <strong>cancel</strong> kar di gayi hai. Agar aap rescheduling chahein toh barah-e-karam foran WhatsApp par rabta karein.

              <div class="chk-card-header">

                <span class="chk-ref">${apt.id || ''}</span>

              <div class="chk-row"><span class="chk-label">Patient:</span><span class="chk-val">${apt.name || ''}</span></div>
              <div class="chk-row"><span class="chk-label">Doctor:</span><span class="chk-val">${apt.doctor || ''}</span></div>
              <div class="chk-row"><span class="chk-label">Treatment:</span><span class="chk-val">${apt.treatment || ''}</span></div>
              <div class="chk-row">
                <span class="chk-label">Date:</span>

              </div>
              <div class="chk-row">
                <span class="chk-label">Time:</span>
                <span class="chk-val" style="${isCancelled ? 'text-decoration:line-through;color:#94a3b8;' : ''}">${apt.time || ''}</span>
              </div>
              <div class="chk-row">
                <span class="chk-label">Status:</span>
                <span class="chk-val" style="${isCancelled ? 'color:#dc2626;font-weight:800;' : 'color:#0d9488;'}">
                  ${isCancelled ? '❌ Cancelled (Mansookh)' : (apt.status || 'Confirmed')}
                </span>
              </div>
              ${apt.queueNumber ? `<div class="chk-row"><span class="chk-label">Queue Position:</span><span class="chk-val" style="color:inherit;font-weight:700">Turn #${apt.queueNumber} in Line</span></div>` : ''}

              <!-- Download Receipt Button (PNG Image for Gallery) -->
              <button type="button" class="chk-receipt-btn" onclick="window.downloadAppointmentReceiptById('${apt.id}')">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
                🖼️ Download Receipt Image (Save to Gallery)
              </button>

              ${isCancelled ? `
                <a class="chk-wa-btn" href="${waUrl}" target="_blank" rel="noopener noreferrer">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
                  Reschedule / Rabta Karein (WhatsApp)
                </a>` : ''}
            </div>`;
        }).join('');
        wrap.innerHTML = `<div class="chk-result-wrap">${html}</div>`;
      }

      /* ── Search logic ── */
      function doSearch() {
        const q = document.getElementById('chkInput').value.trim().toLowerCase();
        if (!q) return;
        let all = [];
        try {
          if (window.ClinicStore && typeof window.ClinicStore.getAppointments === 'function') {
            all = window.ClinicStore.getAppointments();
          } else {
            const raw = localStorage.getItem('smilecare_appointments');
            if (raw) all = JSON.parse(raw);
          }
        } catch(e) {}
        const found = all.filter(a => {
          const refMatch   = (a.id    || '').toLowerCase().includes(q);
          const phoneMatch = (a.phone || '').replace(/\D/g,'').includes(q.replace(/\D/g,''));
          const emailMatch = (a.email || '').toLowerCase().includes(q);
          return refMatch || phoneMatch || emailMatch;
        });
        renderResults(found);
      }

      /* ── Open / Close ── */
      function openModal() {
        document.getElementById('chkOverlay').classList.add('open');
        document.getElementById('chkInput').focus();
      }
      function closeModal() {
        document.getElementById('chkOverlay').classList.remove('open');
        document.getElementById('chkInput').value = '';
        renderResults(null);
      }

      /* ── Inject "Check My Appointment" button into navbar ── */
      function injectNavButton() {
        const header = document.querySelector('header');
        if (!header) return requestAnimationFrame(injectNavButton);

        // Find the Book Visit button
        const btns = header.querySelectorAll('button');
        let bookBtn = null;
        btns.forEach(b => { if (b.textContent.trim().includes('Book')) bookBtn = b; });
        if (!bookBtn) return setTimeout(injectNavButton, 300);

        const chkBtn = document.createElement('button');
        chkBtn.className = 'chk-btn';
        chkBtn.innerHTML = `
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          Check Appointment`;
        chkBtn.onclick = openModal;
        bookBtn.parentNode.insertBefore(chkBtn, bookBtn);
      }

      /* ── Event listeners ── */
      document.getElementById('chkClose').onclick = closeModal;
      document.getElementById('chkOverlay').onclick = function(e) {
        if (e.target === this) closeModal();
      };
      document.getElementById('chkSearchBtn').onclick = doSearch;
      document.getElementById('chkInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') doSearch();
      });
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeModal();
      });

      /* ── Expose globally so the hero "Check My Appointment" button can open it too ── */
      window.openCheckAppointmentModal = openModal;

      /* ── Universal Receipt Generator & Downloader (Direct PNG Image to Gallery) ── */
      function createReceiptCanvas(apt) {
        const token = apt.id || apt.ref || 'SPA-001';
        const name = apt.name || 'Valued Patient';
        const phone = apt.phone || '-';
        const doctor = apt.doctor || 'Dr. Ahmed Khan';
        const suite = apt.suite || 'Suite 1';
        const treatment = apt.treatment || 'Consultation & Treatment';
        const date = apt.date || 'Today';
        const time = apt.time || '10:00 AM';
        const cost = apt.cost || 'PKR 25,000';
        const queueNum = apt.queueNumber || apt.queueNum || '1';
        const status = apt.status || 'Confirmed';
        const isCancelled = String(status).toLowerCase() === 'cancelled';
        const now = new Date().toLocaleString('en-PK', { dateStyle: 'medium', timeStyle: 'short' });

        const canvas = document.createElement('canvas');
        const w = 720;
        const h = isCancelled ? 960 : 910;
        const scale = 2; // High resolution 2x
        canvas.width = w * scale;
        canvas.height = h * scale;
        const ctx = canvas.getContext('2d');
        ctx.scale(scale, scale);

        function drawRoundRect(x, y, width, height, r, fill, stroke, strokeColor, fillColor) {
          ctx.beginPath();
          ctx.moveTo(x + r, y);
          ctx.lineTo(x + width - r, y);
          ctx.quadraticCurveTo(x + width, y, x + width, y + r);
          ctx.lineTo(x + width, y + height - r);
          ctx.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
          ctx.lineTo(x + r, y + height);
          ctx.quadraticCurveTo(x, y + height, x, y + height - r);
          ctx.lineTo(x, y + r);
          ctx.quadraticCurveTo(x, y, x + r, y);
          ctx.closePath();
          if (fill) { ctx.fillStyle = fillColor; ctx.fill(); }
          if (stroke) { ctx.strokeStyle = strokeColor; ctx.lineWidth = 1.5; ctx.stroke(); }
        }

        // 1. Outer Background
        ctx.fillStyle = '#f8fafc';
        ctx.fillRect(0, 0, w, h);

        // 2. White Card Container
        drawRoundRect(20, 20, w - 40, h - 40, 22, true, true, isCancelled ? '#ef4444' : '#0d9488', '#ffffff');

        // 3. Top Decorative Ribbon
        ctx.fillStyle = isCancelled ? '#dc2626' : '#0d9488';
        ctx.beginPath();
        ctx.moveTo(40, 20);
        ctx.lineTo(w - 40, 20);
        ctx.quadraticCurveTo(w - 20, 20, w - 20, 40);
        ctx.lineTo(w - 20, 32);
        ctx.lineTo(20, 32);
        ctx.lineTo(20, 40);
        ctx.quadraticCurveTo(20, 20, 40, 20);
        ctx.closePath();
        ctx.fill();

        // 4. Header Section
        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 25px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
        ctx.fillText('AURA DENTAL SPA', 45, 68);

        ctx.fillStyle = '#0d9488';
        ctx.font = 'bold 12px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.fillText('CLINICAL LUXURY & HOLISTIC DENTISTRY', 45, 90);

        ctx.fillStyle = '#64748b';
        ctx.font = '11px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.fillText('Main Shahbaz Commercial, DHA Phase 6, Karachi', 45, 110);
        ctx.fillText('WhatsApp Reception: +92 300 1234567 • Karachi', 45, 126);

        // 5. Token Box (Top Right)
        const tbX = w - 215;
        const tbY = 46;
        drawRoundRect(tbX, tbY, 170, 84, 14, true, true, isCancelled ? '#ef4444' : '#0d9488', isCancelled ? '#fef2f2' : '#f0fdfa');

        ctx.fillStyle = '#64748b';
        ctx.font = 'bold 10px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('QUEUE TOKEN', tbX + 85, tbY + 22);

        ctx.fillStyle = isCancelled ? '#dc2626' : '#0d9488';
        ctx.font = 'bold 28px monospace';
        ctx.fillText(token, tbX + 85, tbY + 54);

        ctx.fillStyle = isCancelled ? '#b91c1c' : '#0f766e';
        ctx.font = 'bold 11px sans-serif';
        ctx.fillText(`Turn #${queueNum} in Line`, tbX + 85, tbY + 74);
        ctx.textAlign = 'left';

        // 6. Dashed Divider
        ctx.strokeStyle = '#e2e8f0';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([6, 6]);
        ctx.beginPath();
        ctx.moveTo(45, 150);
        ctx.lineTo(w - 45, 150);
        ctx.stroke();
        ctx.setLineDash([]);

        let curY = 175;

        // 7. If Cancelled, Big Warning Banner!
        if (isCancelled) {
          drawRoundRect(45, curY, w - 90, 64, 12, true, true, '#ef4444', '#fee2e2');
          ctx.fillStyle = '#991b1b';
          ctx.font = 'bold 15px sans-serif';
          ctx.fillText('❌ APPOINTMENT CANCEL HO CHUKI HAI (CANCELLED)', 65, curY + 26);
          ctx.fillStyle = '#b91c1c';
          ctx.font = '11.5px sans-serif';
          ctx.fillText('Yeh appointment clinic reception se cancel kar di gayi hai.', 65, curY + 44);
          ctx.fillText('Reschedule / Rabta ke liye WhatsApp karein: +92 300 1234567', 65, curY + 58);
          curY += 78;
        }

        // 8. Title of slip
        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 14px sans-serif';
        ctx.fillText('OFFICIAL PATIENT APPOINTMENT RECEIPT & QUEUE SLIP', 45, curY + 5);
        curY += 22;

        // 9. Two-column grid of info fields
        const fields = [
          { label: 'PATIENT NAME', val: name, col: 1 },
          { label: 'CONTACT MOBILE', val: phone, col: 2 },
          { label: 'SPECIALIST DOCTOR', val: doctor, col: 1 },
          { label: 'SUITE LOCATION', val: suite + ' • DHA Phase 6', col: 2 },
          { label: 'TREATMENT PROCEDURE', val: treatment, col: 0 },
          { label: 'APPOINTMENT DATE', val: date, col: 1, strike: isCancelled },
          { label: 'CONFIRMED TIME SLOT', val: time, col: 2, strike: isCancelled },
          { label: 'CURRENT STATUS', val: isCancelled ? '❌ Cancelled (Mansookh)' : status, col: 1, color: isCancelled ? '#dc2626' : '#0d9488' },
          { label: 'RECEIPT ISSUED AT', val: now, col: 2 }
        ];

        const colW = (w - 90 - 16) / 2;
        const col1X = 45;
        const col2X = 45 + colW + 16;

        for (let i = 0; i < fields.length; i++) {
          const f = fields[i];
          let fX, fY, fW, fH;
          fH = 50;

          if (f.col === 0) {
            fX = col1X;
            fY = curY;
            fW = w - 90;
            curY += 58;
          } else if (f.col === 1) {
            fX = col1X;
            fY = curY;
            fW = colW;
            if (i + 1 < fields.length && fields[i + 1].col === 2) {
              // wait for next to advance curY
            } else {
              curY += 58;
            }
          } else {
            fX = col2X;
            fY = curY;
            fW = colW;
            curY += 58;
          }

          drawRoundRect(fX, fY, fW, fH, 10, true, true, '#e2e8f0', '#f8fafc');

          ctx.fillStyle = '#64748b';
          ctx.font = 'bold 9.5px sans-serif';
          ctx.fillText(f.label, fX + 12, fY + 18);

          ctx.fillStyle = f.color || '#0f172a';
          ctx.font = 'bold 12.5px sans-serif';
          
          let displayVal = f.val;
          if (ctx.measureText(displayVal).width > fW - 24) {
            while (displayVal.length > 3 && ctx.measureText(displayVal + '...').width > fW - 24) {
              displayVal = displayVal.slice(0, -1);
            }
            displayVal += '...';
          }
          ctx.fillText(displayVal, fX + 12, fY + 38);

          if (f.strike) {
            const textW = ctx.measureText(displayVal).width;
            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(fX + 12, fY + 34);
            ctx.lineTo(fX + 12 + textW, fY + 34);
            ctx.stroke();
          }
        }

        curY += 8;

        // 10. Treatment Fee Box
        const feeH = 52;
        drawRoundRect(45, curY, w - 90, feeH, 12, true, true, isCancelled ? '#fca5a5' : '#99f6e4', isCancelled ? '#fef2f2' : '#f0fdfa');
        
        ctx.fillStyle = isCancelled ? '#991b1b' : '#0f766e';
        ctx.font = 'bold 12px sans-serif';
        ctx.fillText('Estimated Treatment Fee', 60, curY + 22);

        ctx.fillStyle = '#64748b';
        ctx.font = '10px sans-serif';
        ctx.fillText('Official Transparent Karachi Rates (0% Markup EMI Available)', 60, curY + 39);

        ctx.fillStyle = isCancelled ? '#b91c1c' : '#0d9488';
        ctx.font = 'bold 22px monospace';
        ctx.textAlign = 'right';
        ctx.fillText(cost, w - 60, curY + 35);
        ctx.textAlign = 'left';

        curY += feeH + 18;

        // 11. Simulated Barcode & Stamp
        ctx.fillStyle = '#0f172a';
        for (let b = 0; b < 44; b++) {
          const barW = ((b * 7 + 3) % 4) + 1.5;
          const barX = 45 + b * 5.5;
          if (barX < 300) {
            ctx.fillRect(barX, curY, barW, 26);
          }
        }
        ctx.fillStyle = '#64748b';
        ctx.font = '10px monospace';
        ctx.fillText('VERIFIED DIGITAL VOUCHER • ' + token, 45, curY + 38);

        // Digital stamp on right
        drawRoundRect(w - 230, curY - 5, 185, 48, 10, true, true, '#10b981', '#ecfdf5');
        ctx.fillStyle = '#047857';
        ctx.font = 'bold 11px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('✓ AURA CLINIC VERIFIED', w - 138, curY + 17);
        ctx.fillStyle = '#059669';
        ctx.font = '9px sans-serif';
        ctx.fillText('DHA Phase 6 • Official Desk', w - 138, curY + 32);
        ctx.textAlign = 'left';

        curY += 56;

        // 12. Footer Notice
        ctx.strokeStyle = '#e2e8f0';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(45, curY);
        ctx.lineTo(w - 45, curY);
        ctx.stroke();

        curY += 16;
        ctx.fillStyle = '#64748b';
        ctx.font = '9.5px sans-serif';
        ctx.fillText('• Free valet parking available on Main Shahbaz Commercial.', 45, curY);
        ctx.fillText('• Please arrive 10 minutes prior to your suite consultation.', 45, curY + 14);
        ctx.fillText('• Emergency / Reschedule WhatsApp: +92 300 1234567 • www.auradentalspa.pk', 45, curY + 28);

        return canvas;
      }

      /* ── Trigger Image Download & Instant On-Screen Receipt Preview Modal ── */
      function showReceiptPreviewModal(canvas, apt) {
        const token = apt.id || apt.ref || 'SPA-001';
        const dataUrl = canvas.toDataURL('image/png');
        const isCancelled = String(apt.status || '').toLowerCase() === 'cancelled';
        
        let existing = document.getElementById('receipt-image-preview-modal');
        if (existing) existing.remove();

        const modal = document.createElement('div');
        modal.id = 'receipt-image-preview-modal';
        modal.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,0.8);backdrop-filter:blur(8px);z-index:9999999;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn 0.25s ease;';
        
        modal.innerHTML = `
          <div style="background:#ffffff;border-radius:24px;max-width:540px;width:100%;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 25px 60px rgba(0,0,0,0.4);overflow:hidden;border:1px solid rgba(226,232,240,0.8);font-family:inherit;">
            <!-- Header -->
            <div style="padding:16px 20px;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;justify-content:space-between;background:${isCancelled ? '#fef2f2' : '#f0fdfa'};">
              <div style="display:flex;align-items:center;gap:10px;">
                <span style="font-size:22px;">${isCancelled ? '❌' : '🖼️'}</span>
                <div>
                  <h4 style="margin:0;font-size:15px;font-weight:800;color:${isCancelled ? '#991b1b' : '#0f766e'};">
                    ${isCancelled ? 'Cancelled Appointment Receipt' : 'Official Appointment Receipt'}
                  </h4>
                  <p style="margin:0;font-size:11px;color:#64748b;font-weight:600;">
                    Token: <strong style="color:#0f172a;">${token}</strong> • Patient: ${apt.name || 'Valued Patient'}
                  </p>
                </div>
              </div>
              <button id="close-receipt-preview-btn" type="button" style="border:none;background:#e2e8f0;width:32px;height:32px;border-radius:50%;cursor:pointer;font-weight:bold;color:#475569;display:flex;align-items:center;justify-content:center;font-size:16px;">✕</button>
            </div>

            <!-- Image Viewport -->
            <div style="padding:16px;overflow-y:auto;background:#f8fafc;display:flex;flex-direction:column;align-items:center;text-align:center;">
              <img id="receipt-preview-img" src="${dataUrl}" alt="Aura Dental Spa Receipt ${token}" style="max-width:100%;max-height:380px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,0.12);border:1px solid #e2e8f0;object-fit:contain;cursor:pointer;" title="Click or long press to save image" />
              <p style="margin:10px 0 0;font-size:12px;color:#475569;line-height:1.4;background:#ffffff;padding:8px 14px;border-radius:10px;border:1px solid #e2e8f0;">
                💡 <strong>Save Tip:</strong> Image par right-click / tap karke <em>"Save Image As..."</em> ya mobile gallery me save kar saktay hain.
              </p>
            </div>

            <!-- Actions Bar -->
            <div style="padding:16px 20px;background:#ffffff;border-top:1px solid #f1f5f9;display:flex;flex-direction:column;gap:10px;">
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                <button id="btn-save-receipt-img" type="button" style="background:#0d9488;color:#ffffff;font-weight:700;padding:12px;border-radius:12px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;box-shadow:0 4px 12px rgba(13,148,136,0.3);">
                  📥 Download Image
                </button>
                <button id="btn-open-receipt-tab" type="button" style="background:#0f172a;color:#ffffff;font-weight:700;padding:12px;border-radius:12px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;">
                  👁️ Open Full Size
                </button>
              </div>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                <button id="btn-copy-receipt-img" type="button" style="background:#f1f5f9;color:#334155;font-weight:700;padding:10px;border-radius:12px;border:1px solid #cbd5e1;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;">
                  📋 Copy to Clipboard
                </button>
                <a href="https://wa.me/923001234567?text=${encodeURIComponent(`Salam Aura Dental Spa, my appointment receipt token is ${token} for ${apt.name || 'patient'}. Date: ${apt.date || ''}`)}" target="_blank" style="background:#25D366;color:#ffffff;font-weight:700;padding:10px;border-radius:12px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;text-decoration:none;">
                  💬 WhatsApp Share
                </a>
              </div>
            </div>
          </div>
        `;

        document.body.appendChild(modal);

        const closeBtn = document.getElementById('close-receipt-preview-btn');
        if (closeBtn) closeBtn.onclick = () => modal.remove();
        modal.onclick = (e) => { if (e.target === modal) modal.remove(); };

        document.getElementById('btn-save-receipt-img').onclick = function() {
          triggerReceiptDownload(canvas, token);
        };

        document.getElementById('btn-open-receipt-tab').onclick = function() {
          const w = window.open('');
          if (w) {
            w.document.write(`
              <html>
                <head>
                  <title>Aura Dental Spa Receipt - ${token}</title>
                  <style>
                    body { margin:0; background:#0f172a; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; font-family:sans-serif; color:#ffffff; padding:20px; box-sizing:border-box; }
                    img { max-width:95%; max-height:85vh; border-radius:14px; box-shadow:0 20px 45px rgba(0,0,0,0.6); }
                    p { margin-top:16px; font-size:14px; color:#94a3b8; font-weight:600; }
                  </style>
                </head>
                <body>
                  <img src="${dataUrl}" alt="Receipt ${token}">
                  <p>Right-click or long-press on mobile to Save Image</p>
                </body>
              </html>
            `);
          }
        };

        document.getElementById('btn-copy-receipt-img').onclick = async function() {
          try {
            canvas.toBlob(async function(blob) {
              if (!blob) return;
              if (navigator.clipboard && window.ClipboardItem) {
                await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
                const btn = document.getElementById('btn-copy-receipt-img');
                if (btn) {
                  btn.innerHTML = '✅ Copied to Clipboard!';
                  setTimeout(() => { if (btn) btn.innerHTML = '📋 Copy to Clipboard'; }, 2000);
                }
              } else {
                alert('Image copy clipboard standard supported browser me chalega. Aap "Download Image" ya "Open Full Size" se save kar saktay hain.');
              }
            }, 'image/png');
          } catch(e) {
            console.warn('Clipboard copy error:', e);
          }
        };
      }

      function triggerReceiptDownload(canvas, token) {
        canvas.toBlob(async function(blob) {
          if (!blob) return;

          // Try modern showSaveFilePicker if available
          if ('showSaveFilePicker' in window) {
            try {
              const handle = await window.showSaveFilePicker({
                suggestedName: `AuraDentalSpa_Receipt_${token}.png`,
                types: [{
                  description: 'PNG Image',
                  accept: { 'image/png': ['.png'] }
                }]
              });
              const writable = await handle.createWritable();
              await writable.write(blob);
              await writable.close();
              showGallerySavedToast(token);
              return;
            } catch (err) {
              if (err.name === 'AbortError') return;
            }
          }

          // Standard fallback <a> download
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `AuraDentalSpa_Receipt_${token}.png`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(url), 2500);
          showGallerySavedToast(token);
        }, 'image/png');
      }

      /* ── Trigger Image Download (PNG format saves straight to Gallery) ── */
      window.downloadAppointmentReceipt = function(apt) {
        if (!apt) {
          const list = window.ClinicStore ? window.ClinicStore.getAppointments() : JSON.parse(localStorage.getItem('smilecare_appointments') || '[]');
          apt = list[0] || {};
        }
        const token = apt.id || apt.ref || 'SPA-001';

        try {
          const canvas = createReceiptCanvas(apt);
          // 1. Show interactive preview modal immediately
          showReceiptPreviewModal(canvas, apt);
          // 2. Trigger direct download in background
          triggerReceiptDownload(canvas, token);
        } catch (err) {
          console.error('Receipt image generation error:', err);
        }
      };

      function showGallerySavedToast(token) {
        let toast = document.getElementById('receipt-image-toast');
        if (!toast) {
          toast = document.createElement('div');
          toast.id = 'receipt-image-toast';
          toast.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0f172a;color:#ffffff;padding:12px 24px;border-radius:9999px;font-size:13px;font-weight:700;z-index:999999;box-shadow:0 10px 30px rgba(0,0,0,0.3);display:flex;align-items:center;gap:10px;border:1px solid rgba(13,148,136,0.6);animation:slideUpToast 0.3s ease;';
          document.body.appendChild(toast);
        }
        toast.innerHTML = `
          <span style="display:inline-flex;width:20px;height:20px;border-radius:50%;background:#0d9488;align-items:center;justify-content:center;font-size:11px;">✓</span>
          <span>Receipt Image (${token}.png) Downloaded &amp; Saved to Gallery!</span>
        `;
        toast.style.display = 'flex';
        clearTimeout(window.__toastTimer);
        window.__toastTimer = setTimeout(() => {
          if (toast) toast.style.display = 'none';
        }, 4000);
      }

      window.downloadAppointmentReceiptById = function(id) {
        let all = [];
        try {
          if (window.ClinicStore && typeof window.ClinicStore.getAppointments === 'function') {
            all = window.ClinicStore.getAppointments();
          } else {
            all = JSON.parse(localStorage.getItem('smilecare_appointments') || '[]');
          }
        } catch(e) {}
        const apt = all.find(a => a.id === id);
        if (apt) {
          window.downloadAppointmentReceipt(apt);
        } else {
          alert('Appointment not found');
        }
      };

      /* ── Watch for React Booking Success Modal to Inject "Download Receipt Image (Gallery)" ── */
      function checkAndEnhanceBookingVoucher() {
        const headings = document.querySelectorAll('h3');
        let isSuccessModal = false;
        headings.forEach(h => {
          if (h.textContent.includes('Voucher & Token Confirmed') || h.textContent.includes('OFFICIAL PATIENT QUEUE VOUCHER')) {
            isSuccessModal = true;
          }
        });

        if (isSuccessModal) {
          if (!document.getElementById('btn-receipt-download-live')) {
            const waBtn = document.querySelector('a[href*="wa.me"][href*="Voucher"]');
            if (waBtn && waBtn.parentNode) {
              const btn = document.createElement('button');
              btn.id = 'btn-receipt-download-live';
              btn.type = 'button';
              btn.className = 'w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3.5 px-4 rounded-full transition-all text-sm shadow-md hover:shadow-lg flex items-center justify-center gap-2 mb-2 cursor-pointer';
              btn.innerHTML = `
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
                <span>🖼️ Download Receipt Image (Save to Gallery)</span>
              `;
              btn.onclick = function() {
                const list = window.ClinicStore ? window.ClinicStore.getAppointments() : JSON.parse(localStorage.getItem('smilecare_appointments') || '[]');
                window.downloadAppointmentReceipt(list[0]);
              };
              waBtn.parentNode.insertBefore(btn, waBtn);

              // ALSO automatically trigger image download after 1 second of booking confirmation
              // so the user gets it automatically in their gallery without even having to click!
              if (!window.__autoDownloadedOnce) {
                window.__autoDownloadedOnce = true;
                setTimeout(() => {
                  const list = window.ClinicStore ? window.ClinicStore.getAppointments() : JSON.parse(localStorage.getItem('smilecare_appointments') || '[]');
                  if (list && list[0]) {
                    window.downloadAppointmentReceipt(list[0]);
                  }
                }, 900);
              }
            }
          }
        } else {
          window.__autoDownloadedOnce = false;
        }
      }

      // Check on DOM changes & intervals
      setInterval(checkAndEnhanceBookingVoucher, 700);

      /* Inject nav button after React renders */
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => setTimeout(injectNavButton, 400));
      } else {
        setTimeout(injectNavButton, 400);
      }
    })();
  </script>
</body>
</html>
